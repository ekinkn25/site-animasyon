# /etc/nginx/sites-available/ekin-site
# Site Cloudflare Tunnel ile yayında: tünel ekinkarincali.com -> http://localhost:80
server {
    listen 80 default_server;
    server_name _;
    root /opt/ekin-site;
    index index.html;

    # Sunucu dosyaları web'den görünmesin
    location ^~ /server/ { return 404; }
    location ~ /\. { return 404; }

    # Defter notları -> Python API
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        # Tünelden gelen her istek 127.0.0.1'den gelir; gerçek ziyaretçi IP'sini
        # Cloudflare bu başlıkta yollar (spam sınırı kişi başına çalışsın diye)
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 16k;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
